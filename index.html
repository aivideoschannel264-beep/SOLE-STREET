<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLE STREET | Premium Footwear</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--k:#000;--w:#fff;--g1:#f3f3f3;--g2:#d9d9d9;--g3:#8a8a8a;--g4:#222;--r:2px}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:400 15px/1.55 'Instrument Sans',sans-serif;color:var(--k);background:var(--w)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
h1,h2,h3,.logo{font-family:Archivo,sans-serif;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--k);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--w);border-bottom:1px solid var(--g2);display:flex;align-items:center;gap:20px;padding:0 20px;height:64px}
.logo{font-weight:900;font-size:22px}
nav{display:flex;gap:20px;margin-left:24px;flex:1}nav a{font-weight:500;color:var(--g4)}nav a:hover{text-decoration:underline;text-underline-offset:6px}
.ic{display:flex;gap:6px;align-items:center}.ic button,.ic a{background:none;border:0;cursor:pointer;padding:8px;position:relative;font-size:15px;font-weight:500}
.cnt{background:var(--k);color:var(--w);border-radius:9px;font-size:11px;padding:1px 6px;margin-left:3px}
#mb{display:none}
.hero{position:relative;height:min(78vh,640px);background:var(--k);color:var(--w);overflow:hidden}
.sl{position:absolute;inset:0;display:flex;align-items:flex-end;padding:6vw;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
.sl.on{opacity:1}.sl:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,.05))}
.sl>div{position:relative;max-width:720px}
.sl h1{font-size:clamp(40px,9vw,112px);font-weight:900;line-height:.95;transform:translateY(30px);opacity:0;transition:.9s .2s}
.sl.on h1{transform:none;opacity:1}
.sl p{margin:16px 0 24px;color:var(--g2);font-size:17px}
.btn{display:inline-block;background:var(--k);color:var(--w);border:1px solid var(--k);padding:14px 28px;font-weight:600;cursor:pointer;border-radius:var(--r);transition:.2s}
.btn:hover{background:var(--g4)}.btn.w{background:var(--w);color:var(--k);border-color:var(--w)}.btn.w:hover{background:var(--g1)}
.btn.o{background:none;color:var(--k)}.btn.o:hover{background:var(--g1)}.btn:disabled{opacity:.4;cursor:not-allowed}
main{min-height:60vh}.wrap{max-width:1240px;margin:0 auto;padding:48px 20px}
h2{font-size:clamp(26px,4vw,40px);font-weight:800;margin-bottom:24px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.cat{background:var(--g1);padding:40px 16px;text-align:center;font:800 18px Archivo;transition:.25s}.cat:hover{background:var(--k);color:var(--w)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px 16px}
.card h3{font:600 15px 'Instrument Sans';margin-top:12px;letter-spacing:0}.card p{color:var(--g3)}
.im{position:relative;aspect-ratio:1;background:var(--g1);overflow:hidden}
.im img,.ph{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:.5s}
.im img.h{opacity:0}.card:hover .im img.h{opacity:1}.card:hover .im img{transform:scale(1.04)}
.ph{display:grid;place-items:center;font:900 15px Archivo;color:var(--g2)}
.hb{position:absolute;top:10px;right:10px;z-index:2;background:var(--w);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--g2);font-size:16px}.hb.on{color:var(--k)}
.so{position:absolute;left:10px;top:10px;background:var(--k);color:var(--w);font-size:12px;padding:2px 10px;font-style:normal}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.bar input,.bar select{padding:11px 14px;border:1px solid var(--g2);background:var(--w);flex:1;min-width:150px}
.chip{padding:9px 16px;border:1px solid var(--g2);background:var(--w);cursor:pointer}.chip.on{background:var(--k);color:var(--w)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px}.pd .im{aspect-ratio:1}.th{display:flex;gap:8px;margin-top:8px}.th img{width:68px;height:68px;object-fit:cover;cursor:pointer;border:2px solid transparent}.th img.on{border-color:var(--k)}
.pd h1{font-size:34px;font-weight:800}.pr{font-size:24px;margin:8px 0 16px}
.sz{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}.sz button{min-width:54px;padding:11px;border:1px solid var(--g2);background:var(--w);cursor:pointer}.sz button.on{background:var(--k);color:var(--w)}.sz button:disabled{color:var(--g2);text-decoration:line-through;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.box{border:1px solid var(--g2);padding:20px}
.ln{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--g2)}.ln img,.ln .ph{width:80px;height:80px;position:static}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:32px}
label{display:block;font-weight:500;margin:12px 0 4px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--g2);background:var(--w)}
.pay{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--g2);margin-top:8px;cursor:pointer}.pay input{width:auto}
.st{display:inline-block;background:var(--g1);padding:2px 10px;font-size:13px}
.tot{display:flex;justify-content:space-between;padding:6px 0}.tot.b{font-weight:700;font-size:18px;border-top:1px solid var(--g2);margin-top:8px;padding-top:12px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;background:var(--g1);padding:28px 20px;text-align:center;font-weight:500}
footer{background:var(--k);color:var(--g2);padding:40px 20px;margin-top:40px;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
footer a{display:block;color:var(--g2);margin-top:6px}footer b{color:var(--w)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--k);color:var(--w);padding:12px 22px;transition:.3s;z-index:50;max-width:90vw}#toast.on{transform:translate(-50%,0)}
.msg{padding:12px;background:var(--g1);margin:12px 0}
@media(max-width:820px){
 #mb{display:block}nav{position:fixed;top:64px;left:0;right:0;background:var(--w);flex-direction:column;margin:0;padding:12px 20px;border-bottom:1px solid var(--g2);display:none}nav.on{display:flex}
 .cats{grid-template-columns:repeat(2,1fr)}.pd,.two{grid-template-columns:1fr}.trust{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
 <button id="mb" onclick="document.querySelector('nav').classList.toggle('on')" aria-label="Menu" style="background:none;border:0;font-size:22px">☰</button>
 <a class="logo" href="#/">SOLE STREET</a>
 <nav onclick="this.classList.remove('on')"><a href="#/shop/men">Men</a><a href="#/shop/women">Women</a><a href="#/shop/sneakers">Sneakers</a><a href="#/shop/sports">Sports</a><a href="#/shop/casual">Casual</a></nav>
 <div class="ic"><a href="#/shop/all">Search</a><a href="#/wish">Wishlist<span class="cnt" id="wc">0</span></a><a href="#/cart">Cart<span class="cnt" id="cc">0</span></a><a href="#/account" id="ac">Account</a></div>
</header>
<main id="app"></main>
<footer>
 <div><b class="logo">SOLE STREET</b><p style="max-width:280px;margin-top:8px">Premium footwear, delivered to your door across Pakistan.</p></div>
 <div><b>Shop</b><a href="#/shop/men">Men's Shoes</a><a href="#/shop/women">Women's Shoes</a><a href="#/shop/sneakers">Sneakers</a></div>
 <div><b>Help</b><a href="#/track">Track order</a><a href="#/about">About us</a><a href="#/contact">Contact</a></div>
</footer>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY);
const CATS={men:"Men's Shoes",women:"Women's Shoes",sneakers:'Sneakers',sports:'Sports Shoes',casual:'Casual Shoes'};
const ST={pending:'Pending',confirmed:'Confirmed',ordered_from_supplier:'Being prepared',shipped:'Shipped',delivered:'Delivered',cancelled:'Cancelled'};
const $=s=>document.querySelector(s),R=n=>CFG.CUR+' '+Number(n).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ls=(k,d)=>{try{return JSON.parse(localStorage[k])}catch{return d}};
let P=[],B=[],U=null,cart=ls('cart',[]),wish=ls('wish',[]),coupon=ls('coupon',null),sel=null,tmr;
const save=()=>{localStorage.cart=JSON.stringify(cart);localStorage.wish=JSON.stringify(wish);localStorage.coupon=JSON.stringify(coupon);$('#cc').textContent=cart.reduce((a,c)=>a+c.qty,0);$('#wc').textContent=wish.length;$('#ac').textContent=U?'My account':'Login'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
const stock=p=>Object.values(p.sizes||{}).reduce((a,b)=>a+Number(b),0);
const im=(p,i,c='')=>p.images?.[i]?`<img class="${c}" loading="lazy" src="${esc(p.images[i])}" alt="${esc(p.name)}">`:(i?'':'<div class="ph">SOLE STREET</div>');
const card=p=>`<a class="card" href="#/p/${p.id}"><div class="im">${im(p,0)}${im(p,1,'h')}<button class="hb ${wish.includes(p.id)?'on':''}" aria-label="Wishlist" onclick="event.preventDefault();tw(${p.id},this)">♥</button>${stock(p)?'':'<i class="so">Sold out</i>'}</div><h3>${esc(p.name)}</h3><p>${R(p.price)}</p></a>`;
function tw(id,el){wish=wish.includes(id)?wish.filter(x=>x!=id):[...wish,id];el.classList.toggle('on');save();if(location.hash=='#/wish')route()}
async function init(){
 const{data:{session}}=await sb.auth.getSession();U=session?.user||null;
 sb.auth.onAuthStateChange((_,s)=>{U=s?.user||null;save()});
 const[a,b]=await Promise.all([sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false}),sb.from('banners').select('*').eq('active',true).order('sort')]);
 P=a.data||[];B=b.data||[];save();route();
}
addEventListener('hashchange',route);
function route(){
 clearInterval(tmr);const[v,a]=location.hash.slice(2).split('/');const app=$('#app');
 const V={'':home,shop:()=>shop(a||'all'),p:()=>prod(+a),cart:cartV,checkout:checkout,account:account,wish:wishV,track:track,about:about,contact:contact};
 (V[v||'']||home)();if(!route.last||route.last!=location.hash)scrollTo(0,0);route.last=location.hash;
}
function home(){
 const sl=B.length?B:[{title:'Walk the street like you own it',subtitle:'New season footwear, made to be noticed.',category:'all'}];
 $('#app').innerHTML=`<section class="hero">${sl.map((b,i)=>`<div class="sl ${i?'':'on'}" style="${b.image_url?`background-image:url('${esc(b.image_url)}')`:''}"><div><h1>${esc(b.title)}</h1><p>${esc(b.subtitle||'')}</p><a class="btn w" href="#/shop/${esc(b.category||'all')}">Shop now</a></div></div>`).join('')}</section>
 <div class="wrap"><h2>Shop by category</h2><div class="cats">${Object.entries(CATS).map(([k,n])=>`<a class="cat" href="#/shop/${k}">${n}</a>`).join('')}</div></div>
 <div class="wrap" style="padding-top:0"><h2>New arrivals</h2>${P.length?`<div class="grid">${P.slice(0,8).map(card).join('')}</div>`:'<div class="msg">No shoes yet. Add your first product in the admin panel.</div>'}</div>
 <div class="trust"><span>Cash on delivery</span><span>JazzCash and Easypaisa</span><span>Order tracking</span><span>Easy size selection</span></div>`;
 if(sl.length>1){let i=0;const s=document.querySelectorAll('.sl');tmr=setInterval(()=>{s[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on')},5000)}
}
function shop(cat,q='',sort=''){
 let L=P.filter(p=>(cat=='all'||p.category==cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
 if(sort=='lo')L.sort((a,b)=>a.price-b.price);if(sort=='hi')L.sort((a,b)=>b.price-a.price);
 $('#app').innerHTML=`<div class="wrap"><h2>${cat=='all'?'All shoes':CATS[cat]||'Shoes'}</h2>
 <div class="bar"><input id="q" placeholder="Search shoes" value="${esc(q)}"><select id="so"><option value="">Newest</option><option value="lo" ${sort=='lo'?'selected':''}>Price: low to high</option><option value="hi" ${sort=='hi'?'selected':''}>Price: high to low</option></select></div>
 <div class="bar">${['all',...Object.keys(CATS)].map(k=>`<a class="chip ${k==cat?'on':''}" href="#/shop/${k}">${k=='all'?'All':CATS[k]}</a>`).join('')}</div>
 <div class="grid">${L.map(card).join('')||'<div class="msg">No shoes match your search.</div>'}</div></div>`;
 const f=()=>{const y=$('#so').value,x=$('#q').value;const g=$('.grid');let M=P.filter(p=>(cat=='all'||p.category==cat)&&p.name.toLowerCase().includes(x.toLowerCase()));if(y=='lo')M.sort((a,b)=>a.price-b.price);if(y=='hi')M.sort((a,b)=>b.price-a.price);g.innerHTML=M.map(card).join('')||'<div class="msg">No shoes match your search.</div>'};
 $('#q').oninput=f;$('#so').onchange=f;
}
function prod(id){
 const p=P.find(x=>x.id==id);if(!p)return $('#app').innerHTML='<div class="wrap"><div class="msg">Product not found.</div></div>';
 sel=null;const sz=Object.keys(p.sizes||{}).sort((a,b)=>a-b);
 $('#app').innerHTML=`<div class="wrap"><div class="pd"><div><div class="im" id="main">${im(p,0)}</div><div class="th">${(p.images||[]).map((u,i)=>`<img src="${esc(u)}" class="${i?'':'on'}" onclick="document.querySelector('#main').innerHTML='<img src=&quot;${esc(u)}&quot;>';document.querySelectorAll('.th img').forEach(e=>e.classList.remove('on'));this.classList.add('on')" alt="">`).join('')}</div></div>
 <div><p style="color:var(--g3)">${CATS[p.category]||''}</p><h1>${esc(p.name)}</h1><div class="pr">${R(p.price)}</div><p style="white-space:pre-line">${esc(p.description)}</p>
 <label>Select size</label><div class="sz">${sz.map(s=>`<button ${p.sizes[s]>0?'':'disabled'} onclick="sel='${s}';document.querySelectorAll('.sz button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${s}</button>`).join('')||'Out of stock'}</div>
 <label>Quantity</label><input id="qty" type="number" min="1" value="1" style="width:90px">
 <div class="row"><button class="btn o" onclick="add(${p.id})">Add to cart</button><button class="btn" onclick="add(${p.id},1)">Buy now</button><button class="btn o" onclick="tw(${p.id},this)">♥ Wishlist</button></div></div></div></div>`;
}
function add(id,go){
 if(!sel)return toast('Please select a size');const p=P.find(x=>x.id==id),q=Math.max(1,+$('#qty').value||1);
 const l=cart.find(c=>c.id==id&&c.size==sel),have=(l?.qty||0)+q;
 if(have>p.sizes[sel])return toast('Only '+p.sizes[sel]+' left in this size');
 l?l.qty=have:cart.push({id,size:sel,qty:q});save();toast('Added to cart');if(go)location.hash='#/checkout';
}
const lines=()=>cart.map(c=>({...c,p:P.find(x=>x.id==c.id)})).filter(c=>c.p);
const sub=()=>lines().reduce((a,c)=>a+c.p.price*c.qty,0);
const disc=()=>coupon?Math.round(sub()*coupon.pct/100):0;
function cartV(){
 const L=lines();
 $('#app').innerHTML=`<div class="wrap"><h2>Your cart</h2>${L.length?`<div class="two"><div>${L.map(c=>`<div class="ln"><div class="im">${im(c.p,0)}</div><div><b>${esc(c.p.name)}</b><br>Size ${esc(c.size)} · ${R(c.p.price)}<br><input type="number" min="1" value="${c.qty}" style="width:70px;margin-top:6px" onchange="qt(${c.id},'${c.size}',this.value)"></div><button class="btn o" onclick="rm(${c.id},'${c.size}')">Remove</button></div>`).join('')}</div>
 <div class="box"><label style="margin-top:0">Discount code</label><div class="row" style="margin:0"><input id="cp" placeholder="Enter code" value="${coupon?esc(coupon.code):''}" style="flex:1"><button class="btn o" onclick="cpn()">Apply</button></div>
 <div class="tot" style="margin-top:16px"><span>Subtotal</span><span>${R(sub())}</span></div><div class="tot"><span>Discount</span><span>- ${R(disc())}</span></div><div class="tot b"><span>Total</span><span>${R(sub()-disc())}</span></div>
 <a class="btn" style="display:block;text-align:center;margin-top:16px" href="#/checkout">Checkout</a></div></div>`:'<div class="msg">Your cart is empty. <a href="#/shop/all"><u>Browse shoes</u></a></div>'}</div>`;
}
const qt=(id,s,v)=>{const c=cart.find(x=>x.id==id&&x.size==s),p=P.find(x=>x.id==id);c.qty=Math.min(Math.max(1,+v||1),p.sizes[s]||1);save();cartV()};
const rm=(id,s)=>{cart=cart.filter(x=>!(x.id==id&&x.size==s));save();cartV()};
async function cpn(){
 const code=$('#cp').value.trim().toUpperCase();if(!code){coupon=null;save();return cartV()}
 const{data}=await sb.rpc('check_coupon',{p_code:code});
 if(data){coupon={code,pct:data};toast(data+'% discount applied')}else{coupon=null;toast('Invalid or expired code')}save();cartV();
}
function checkout(){
 if(!cart.length)return location.hash='#/cart';
 if(!U){sessionStorage.next='#/checkout';return $('#app').innerHTML='<div class="wrap"><div class="msg">Please log in or create an account to place your order. <a href="#/account"><u>Continue</u></a></div></div>'}
 $('#app').innerHTML=`<div class="wrap"><h2>Checkout</h2><div class="two"><form id="f" class="box"><label style="margin-top:0">Full name</label><input name="n" required><label>Phone (for delivery and tracking)</label><input name="ph" type="tel" required placeholder="03XXXXXXXXX"><label>Delivery address</label><textarea name="ad" rows="3" required></textarea><label>City</label><input name="ci" required>
 <label>Payment method</label>
 <label class="pay"><input type="radio" name="m" value="cod" checked>Cash on delivery</label>
 <label class="pay"><input type="radio" name="m" value="jazzcash">JazzCash</label>
 <label class="pay"><input type="radio" name="m" value="easypaisa">Easypaisa</label>
 <div id="wl" class="msg" style="display:none"></div><input name="rf" id="rf" placeholder="Transaction ID" style="display:none;margin-top:8px">
 <button class="btn" style="width:100%;margin-top:18px" id="pb">Place order</button></form>
 <div class="box"><b>Order summary</b>${lines().map(c=>`<div class="tot"><span>${esc(c.p.name)} (${esc(c.size)}) × ${c.qty}</span><span>${R(c.p.price*c.qty)}</span></div>`).join('')}<div class="tot"><span>Discount</span><span>- ${R(disc())}</span></div><div class="tot b"><span>Total</span><span>${R(sub()-disc())}</span></div></div></div></div>`;
 const f=$('#f');
 f.onchange=()=>{const m=f.m.value,w=$('#wl');w.style.display=$('#rf').style.display=m=='cod'?'none':'block';$('#rf').required=m!='cod';w.textContent=m=='cod'?'':`Send ${R(sub()-disc())} to ${m=='jazzcash'?'JazzCash':'Easypaisa'} account ${m=='jazzcash'?CFG.JAZZ:CFG.EASY}, then enter the transaction ID below. We confirm your order after verifying the payment.`};
 f.onsubmit=async e=>{e.preventDefault();$('#pb').disabled=true;
  const{data,error}=await sb.rpc('place_order',{p_items:cart.map(({id,size,qty})=>({id,size,qty})),p_name:f.n.value,p_phone:f.ph.value.trim(),p_address:f.ad.value,p_city:f.ci.value,p_method:f.m.value,p_ref:f.rf.value||null,p_coupon:coupon?.code||null});
  if(error){$('#pb').disabled=false;return toast(error.message)}
  cart=[];coupon=null;save();const{data:d}=await sb.from('products').select('*').eq('active',true);P=d||P;
  $('#app').innerHTML=`<div class="wrap"><h2>Thank you!</h2><div class="msg">Your order number is <b>#${data}</b>. Keep it with your phone number to track your delivery.</div><a class="btn" href="#/track">Track order</a></div>`;
 };
}
function account(){
 if(U)return acct();
 $('#app').innerHTML=`<div class="wrap" style="max-width:460px"><h2>Login</h2><form id="lf"><label>Email</label><input name="e" type="email" required><label>Password</label><input name="p" type="password" required><button class="btn" style="width:100%;margin-top:16px">Login</button></form>
 <h2 style="margin-top:40px">Create account</h2><form id="rf2"><label>Full name</label><input name="n" required><label>Phone</label><input name="ph" type="tel" required><label>Email</label><input name="e" type="email" required><label>Password (6+ characters)</label><input name="p" type="password" minlength="6" required><button class="btn" style="width:100%;margin-top:16px">Register</button></form></div>`;
 const done=()=>{const n=sessionStorage.next||'#/account';sessionStorage.removeItem('next');location.hash=n;setTimeout(route,50)};
 $('#lf').onsubmit=async e=>{e.preventDefault();const f=e.target,{data,error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});if(error)return toast(error.message);U=data.user;save();done()};
 $('#rf2').onsubmit=async e=>{e.preventDefault();const f=e.target,{data,error}=await sb.auth.signUp({email:f.e.value,password:f.p.value,options:{data:{full_name:f.n.value,phone:f.ph.value}}});if(error)return toast(error.message);if(!data.session)return toast('Check your email to confirm, then log in');U=data.user;save();done()};
}
async function acct(){
